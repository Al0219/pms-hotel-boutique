name: CI - Dev Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  backend:
    name: Build & Test Backend (Spring Boot + JaCoCo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pms_hotel
          POSTGRES_USER: pms_app
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pms_app -d pms_hotel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compile Backend with Maven
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests
        env:
          PMS_DATABASE_URL: jdbc:postgresql://localhost:5432/pms_hotel
          PMS_DATABASE_USERNAME: pms_app
          PMS_DATABASE_PASSWORD: ci-password
          SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
          SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "0"

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco/jacoco.xml
          retention-days: 2
          if-no-files-found: ignore

      - name: Upload Compiled Classes for Sonar
        uses: actions/upload-artifact@v4
        with:
          name: backend-classes
          path: backend/target/classes
          retention-days: 2

  frontend:
    name: Build & Test Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/pms-hotel-web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/pms-hotel-web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test

      - name: Validate Next.js Build
        run: npm run build
        env:
          NEXT_PUBLIC_USE_MOCK_API: "false"
          NEXT_PUBLIC_API_BASE_URL: "/api"

  sonar:
    name: SonarQube Quality Gate
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download JaCoCo Coverage Report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco

      - name: Download Compiled Classes
        uses: actions/download-artifact@v4
        with:
          name: backend-classes
          path: backend/target/classes

      - name: Setup Java JDK 21 (for Sonar Scanner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: SonarCloud / SonarQube Quality Gate Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY || 'pms-hotel-boutique' }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION || 'pms-hotel-org' }}
            -Dsonar.sources=backend/src/main/java,frontend/pms-hotel-web/src
            -Dsonar.tests=backend/src/test/java,frontend/pms-hotel-web/src
            -Dsonar.java.binaries=backend/target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
            -Dsonar.qualitygate.wait=true
        continue-on-error: false

      - name: Publish CI Pipeline Summary
        if: always()
        run: |
          echo "## 📊 Resumen de Integración Continua (Rama dev)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Validación | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend Build (JDK 21)** | ${{ needs.backend.result == 'success' && '✅ Aprobado' || '❌ Fallido' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend Build & Test (Node 20)** | ${{ needs.frontend.result == 'success' && '✅ Aprobado' || '❌ Fallido' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **SonarQube Quality Gate** | ${{ job.status == 'success' && '✅ Verificado (Aprobado)' || '⚠️ Pendiente / Revisar' }} |" >> $GITHUB_STEP_SUMMARY
