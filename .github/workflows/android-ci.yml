name: Android CI

on:
  pull_request:
    paths:
      - 'frontend/pms-hotel-android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/pms-hotel-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/pms-hotel-android/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run doctor
      - run: npm run typecheck
      - run: npm run test
      - run: npm run export
