# SonarCloud / SonarQube Project Configuration
sonar.projectKey=pms-hotel-boutique
sonar.projectName=PMS Hotel Boutique
sonar.organization=pms-hotel-org

# Source code and tests definitions
sonar.sources=backend/src/main/java,frontend/pms-hotel-web/src
sonar.tests=backend/src/test/java,frontend/pms-hotel-web/src
sonar.test.inclusions=**/*Test*.java,**/*.test.ts,**/*.test.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/target/**,**/.next/**,**/public/**,**/android/**,**/*.config.*,**/*.d.ts
sonar.coverage.exclusions=**/node_modules/**,**/target/**,**/.next/**,**/public/**,**/android/**,**/*.config.*,**/*.d.ts

# Java binaries and coverage
sonar.java.binaries=backend/target/classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Quality Gate strict verification
sonar.qualitygate.wait=true
sonar.sourceEncoding=UTF-8

