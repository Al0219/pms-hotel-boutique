databaseChangeLog:
  - changeSet:
      id: 005-operations-002
      author: juan-bd3
      changes:
        - createTable:
            tableName: service_requests
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: property_id, type: uuid, constraints: { nullable: false, foreignKeyName: fk_sr_property, references: properties(id) } }
              - column: { name: category, type: varchar(16), constraints: { nullable: false } }
              - column: { name: reservation_id, type: uuid, constraints: { nullable: true, foreignKeyName: fk_sr_reservation, references: reservations(id) } }
              - column: { name: stay_id, type: uuid, constraints: { nullable: true, foreignKeyName: fk_sr_stay, references: reservation_stays(id) } }
              - column: { name: room_id, type: uuid }
              - column: { name: guest_profile_id, type: uuid, constraints: { nullable: true, foreignKeyName: fk_sr_guest, references: guest_profiles(id) } }
              - column: { name: subject, type: varchar(160), constraints: { nullable: false } }
              - column: { name: detail, type: text }
              - column: { name: priority, type: varchar(8), constraints: { nullable: false } }
              - column: { name: status, type: varchar(16), constraints: { nullable: false } }
              - column: { name: created_by, type: uuid, constraints: { nullable: true, foreignKeyName: fk_sr_reporter, references: staff_users(id) } }
              - column: { name: assigned_to, type: uuid, constraints: { nullable: true, foreignKeyName: fk_sr_assignee, references: staff_users(id) } }
              - column: { name: due_at, type: timestamptz }
              - column: { name: completed_at, type: timestamptz }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
        - sql:
            dbms: postgresql
            sql: ALTER TABLE service_requests ADD CONSTRAINT fk_sr_property_room FOREIGN KEY (property_id, room_id) REFERENCES rooms(property_id, id)
        - sql:
            dbms: postgresql
            sql: ALTER TABLE service_requests ADD CONSTRAINT ck_sr_category CHECK (category IN ('CONCIERGE', 'VALET', 'HOUSEKEEPING', 'MAINTENANCE', 'OTHER'))
        - sql:
            dbms: postgresql
            sql: ALTER TABLE service_requests ADD CONSTRAINT ck_sr_subject CHECK (btrim(subject) <> '')
        - sql:
            dbms: postgresql
            sql: ALTER TABLE service_requests ADD CONSTRAINT ck_sr_priority CHECK (priority IN ('LOW', 'MEDIUM', 'HIGH', 'URGENT'))
        - sql:
            dbms: postgresql
            sql: ALTER TABLE service_requests ADD CONSTRAINT ck_sr_status CHECK (status IN ('OPEN', 'IN_PROGRESS', 'DONE', 'CANCELLED'))
        - createIndex: { tableName: service_requests, indexName: ix_sr_property_status, columns: [ { column: { name: property_id } }, { column: { name: status } } ] }
        - createIndex: { tableName: service_requests, indexName: ix_sr_reservation, columns: [ { column: { name: reservation_id } } ] }
        - createTable:
            tableName: service_messages
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: property_id, type: uuid, constraints: { nullable: false, foreignKeyName: fk_sm_property, references: properties(id) } }
              - column: { name: guest_profile_id, type: uuid, constraints: { nullable: false, foreignKeyName: fk_sm_guest, references: guest_profiles(id) } }
              - column: { name: reservation_id, type: uuid, constraints: { nullable: true, foreignKeyName: fk_sm_reservation, references: reservations(id) } }
              - column: { name: request_id, type: uuid, constraints: { nullable: true, foreignKeyName: fk_sm_request, references: service_requests(id) } }
              - column: { name: channel, type: varchar(16), constraints: { nullable: false } }
              - column: { name: direction, type: varchar(8), constraints: { nullable: false } }
              - column: { name: body, type: text, constraints: { nullable: false } }
              - column: { name: created_by, type: uuid, constraints: { nullable: true, foreignKeyName: fk_sm_author, references: staff_users(id) } }
              - column: { name: sent_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
        - sql:
            dbms: postgresql
            sql: ALTER TABLE service_messages ADD CONSTRAINT ck_sm_channel CHECK (channel IN ('IN_APP', 'SMS', 'EMAIL', 'WHATSAPP'))
        - sql:
            dbms: postgresql
            sql: ALTER TABLE service_messages ADD CONSTRAINT ck_sm_direction CHECK (direction IN ('INBOUND', 'OUTBOUND'))
        - sql:
            dbms: postgresql
            sql: ALTER TABLE service_messages ADD CONSTRAINT ck_sm_body CHECK (btrim(body) <> '')
        - createIndex: { tableName: service_messages, indexName: ix_sm_profile, columns: [ { column: { name: guest_profile_id } } ] }
        - createIndex: { tableName: service_messages, indexName: ix_sm_property, columns: [ { column: { name: property_id } } ] }
        - createTable:
            tableName: hk_discrepancies
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: property_id, type: uuid, constraints: { nullable: false, foreignKeyName: fk_hd_property, references: properties(id) } }
              - column: { name: room_id, type: uuid, constraints: { nullable: false } }
              - column: { name: fo_status, type: varchar(16), constraints: { nullable: false } }
              - column: { name: hk_status, type: varchar(16), constraints: { nullable: false } }
              - column: { name: status, type: varchar(16), constraints: { nullable: false } }
              - column: { name: resolution, type: varchar(500) }
              - column: { name: reported_by, type: uuid, constraints: { nullable: true, foreignKeyName: fk_hd_reporter, references: staff_users(id) } }
              - column: { name: resolved_by, type: uuid, constraints: { nullable: true, foreignKeyName: fk_hd_resolver, references: staff_users(id) } }
              - column: { name: resolved_at, type: timestamptz }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
        - sql:
            dbms: postgresql
            sql: ALTER TABLE hk_discrepancies ADD CONSTRAINT fk_hd_property_room FOREIGN KEY (property_id, room_id) REFERENCES rooms(property_id, id)
        - sql:
            dbms: postgresql
            sql: ALTER TABLE hk_discrepancies ADD CONSTRAINT ck_hd_fo_status CHECK (fo_status IN ('OCCUPIED', 'VACANT'))
        - sql:
            dbms: postgresql
            sql: ALTER TABLE hk_discrepancies ADD CONSTRAINT ck_hd_hk_status CHECK (hk_status IN ('DIRTY', 'CLEAN', 'INSPECTED'))
        - sql:
            dbms: postgresql
            sql: ALTER TABLE hk_discrepancies ADD CONSTRAINT ck_hd_status CHECK (status IN ('OPEN', 'INVESTIGATING', 'RECONCILED', 'CANCELLED'))
        - createIndex: { tableName: hk_discrepancies, indexName: ix_hd_property_status, columns: [ { column: { name: property_id } }, { column: { name: status } } ] }
      rollback:
        - sql:
            dbms: postgresql
            sql: DROP TABLE hk_discrepancies; DROP TABLE service_messages; DROP TABLE service_requests;
