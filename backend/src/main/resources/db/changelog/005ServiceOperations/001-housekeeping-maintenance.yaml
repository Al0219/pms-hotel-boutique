databaseChangeLog:
  - changeSet:
      id: 005-operations-001
      author: juan-bd3
      changes:
        - createTable:
            tableName: hk_room_states
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: property_id, type: uuid, constraints: { nullable: false, foreignKeyName: fk_hk_property, references: properties(id) } }
              - column: { name: room_id, type: uuid, constraints: { nullable: false } }
              - column: { name: status, type: varchar(16), constraints: { nullable: false } }
              - column: { name: dnd, type: boolean, constraints: { nullable: false } }
              - column: { name: updated_by, type: uuid, constraints: { nullable: true, foreignKeyName: fk_hk_actor, references: staff_users(id) } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
        - sql:
            dbms: postgresql
            sql: ALTER TABLE hk_room_states ADD CONSTRAINT fk_hk_property_room FOREIGN KEY (property_id, room_id) REFERENCES rooms(property_id, id)
        - sql:
            dbms: postgresql
            sql: ALTER TABLE hk_room_states ADD CONSTRAINT ck_hk_status CHECK (status IN ('DIRTY', 'CLEAN', 'INSPECTED'))
        - addUniqueConstraint:
            tableName: hk_room_states
            columnNames: property_id, room_id
            constraintName: uq_hk_property_room
        - createTable:
            tableName: maintenance_orders
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: property_id, type: uuid, constraints: { nullable: false, foreignKeyName: fk_mo_property, references: properties(id) } }
              - column: { name: room_id, type: uuid }
              - column: { name: ooo_record_id, type: uuid, constraints: { nullable: true, foreignKeyName: fk_mo_outage, references: out_of_order_records(id) } }
              - column: { name: title, type: varchar(160), constraints: { nullable: false } }
              - column: { name: description, type: varchar(1000) }
              - column: { name: priority, type: varchar(8), constraints: { nullable: false } }
              - column: { name: status, type: varchar(16), constraints: { nullable: false } }
              - column: { name: created_by, type: uuid, constraints: { nullable: true, foreignKeyName: fk_mo_reporter, references: staff_users(id) } }
              - column: { name: assigned_to, type: uuid, constraints: { nullable: true, foreignKeyName: fk_mo_assignee, references: staff_users(id) } }
              - column: { name: resolved_at, type: timestamptz }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
        - sql:
            dbms: postgresql
            sql: ALTER TABLE maintenance_orders ADD CONSTRAINT fk_mo_property_room FOREIGN KEY (property_id, room_id) REFERENCES rooms(property_id, id)
        - sql:
            dbms: postgresql
            sql: ALTER TABLE maintenance_orders ADD CONSTRAINT ck_mo_title CHECK (btrim(title) <> '')
        - sql:
            dbms: postgresql
            sql: ALTER TABLE maintenance_orders ADD CONSTRAINT ck_mo_priority CHECK (priority IN ('LOW', 'MEDIUM', 'HIGH', 'URGENT'))
        - sql:
            dbms: postgresql
            sql: ALTER TABLE maintenance_orders ADD CONSTRAINT ck_mo_status CHECK (status IN ('OPEN', 'IN_PROGRESS', 'RESOLVED', 'CANCELLED'))
        - createIndex: { tableName: maintenance_orders, indexName: ix_mo_property_status, columns: [ { column: { name: property_id } }, { column: { name: status } } ] }
      rollback:
        - sql:
            dbms: postgresql
            sql: DROP TABLE maintenance_orders; DROP TABLE hk_room_states;
