databaseChangeLog:
  - changeSet:
      id: 003-public-reservation-query-015
      author: jose-bd2
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE TABLE public_reservation_queries (
                id uuid PRIMARY KEY,
                email_fingerprint char(64) NOT NULL,
                code_fingerprint char(64) NOT NULL,
                outcome varchar(8) NOT NULL CHECK (outcome IN ('FOUND','MISS')),
                occurred_at timestamptz NOT NULL
              );
              CREATE INDEX ix_public_query_email ON public_reservation_queries(email_fingerprint,occurred_at DESC);
              CREATE INDEX ix_public_query_code ON public_reservation_queries(code_fingerprint,occurred_at DESC);
              CREATE TRIGGER public_query_append_only BEFORE UPDATE OR DELETE ON public_reservation_queries
                FOR EACH ROW EXECUTE FUNCTION reject_lookup_audit_mutation();
