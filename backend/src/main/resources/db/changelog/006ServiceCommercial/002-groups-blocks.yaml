databaseChangeLog:
  - changeSet:
      id: 006-commercial-002
      author: juan-bd3
      changes:
        - createTable:
            tableName: event_groups
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: property_id, type: uuid, constraints: { nullable: false, foreignKeyName: fk_groups_property, references: properties(id) } }
              - column: { name: code, type: varchar(64), constraints: { nullable: false } }
              - column: { name: name, type: varchar(160), constraints: { nullable: false } }
              - column: { name: status, type: varchar(16), constraints: { nullable: false } }
              - column: { name: company_id, type: uuid, constraints: { nullable: true, foreignKeyName: fk_groups_company, references: companies(id) } }
              - column: { name: agency_id, type: uuid, constraints: { nullable: true, foreignKeyName: fk_groups_agency, references: agencies(id) } }
              - column: { name: arrival, type: date, constraints: { nullable: false } }
              - column: { name: departure, type: date, constraints: { nullable: false } }
              - column: { name: cutoff_date, type: date }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
        - sql:
            dbms: postgresql
            sql: ALTER TABLE event_groups ADD CONSTRAINT ck_groups_status CHECK (status IN ('INQUIRY', 'TENTATIVE', 'DEFINITE', 'IN_HOUSE', 'CLOSED'))
        - sql:
            dbms: postgresql
            sql: ALTER TABLE event_groups ADD CONSTRAINT ck_groups_code CHECK (btrim(code) <> '')
        - sql:
            dbms: postgresql
            sql: ALTER TABLE event_groups ADD CONSTRAINT ck_groups_name CHECK (btrim(name) <> '')
        - sql:
            dbms: postgresql
            sql: ALTER TABLE event_groups ADD CONSTRAINT ck_groups_period CHECK (arrival < departure)
        - sql:
            dbms: postgresql
            sql: ALTER TABLE event_groups ADD CONSTRAINT ck_groups_cutoff CHECK (cutoff_date IS NULL OR cutoff_date <= arrival)
        - addUniqueConstraint:
            tableName: event_groups
            columnNames: property_id, code
            constraintName: uq_groups_property_code
        - createIndex: { tableName: event_groups, indexName: ix_groups_property, columns: [ { column: { name: property_id } } ] }
        - createTable:
            tableName: room_blocks
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: group_id, type: uuid, constraints: { nullable: false, foreignKeyName: fk_blocks_group, references: event_groups(id) } }
              - column: { name: property_id, type: uuid, constraints: { nullable: false, foreignKeyName: fk_blocks_property, references: properties(id) } }
              - column: { name: room_type_id, type: uuid, constraints: { nullable: false } }
              - column: { name: arrival, type: date, constraints: { nullable: false } }
              - column: { name: departure, type: date, constraints: { nullable: false } }
              - column: { name: units_held, type: int, constraints: { nullable: false } }
              - column: { name: status, type: varchar(16), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: room_blocks
            baseColumnNames: property_id, room_type_id
            constraintName: fk_blocks_property_type
            referencedTableName: room_types
            referencedColumnNames: property_id, id
        - sql:
            dbms: postgresql
            sql: ALTER TABLE room_blocks ADD CONSTRAINT ck_blocks_status CHECK (status IN ('ACTIVE', 'RELEASED'))
        - sql:
            dbms: postgresql
            sql: ALTER TABLE room_blocks ADD CONSTRAINT ck_blocks_period CHECK (arrival < departure)
        - sql:
            dbms: postgresql
            sql: ALTER TABLE room_blocks ADD CONSTRAINT ck_blocks_units CHECK (units_held > 0)
        - createIndex: { tableName: room_blocks, indexName: ix_blocks_group, columns: [ { column: { name: group_id } } ] }
        - createIndex: { tableName: room_blocks, indexName: ix_blocks_property, columns: [ { column: { name: property_id } } ] }
        # Pickup wiring: reservations optionally belong to one group and consume
        # one of its blocks. Commercial hold only: blocks never move physical
        # rooms, and pickup is derived from stays, never stored.
        - addColumn:
            tableName: reservations
            columns:
              - column: { name: group_id, type: uuid, constraints: { nullable: true, foreignKeyName: fk_reservations_group, references: event_groups(id) } }
              - column: { name: room_block_id, type: uuid, constraints: { nullable: true, foreignKeyName: fk_reservations_block, references: room_blocks(id) } }
        - createIndex: { tableName: reservations, indexName: ix_reservations_group, columns: [ { column: { name: group_id } } ] }
        - createIndex: { tableName: reservations, indexName: ix_reservations_block, columns: [ { column: { name: room_block_id } } ] }
        # Master folio wiring: at most one MASTER folio consolidates a group.
        - addColumn:
            tableName: folios
            columns:
              - column: { name: group_id, type: uuid, constraints: { nullable: true, foreignKeyName: fk_folios_group, references: event_groups(id) } }
        - createIndex: { tableName: folios, indexName: ix_folios_group, columns: [ { column: { name: group_id } } ] }
        - sql:
            dbms: postgresql
            sql: CREATE UNIQUE INDEX uq_master_folio_group ON folios(group_id) WHERE type = 'MASTER' AND group_id IS NOT NULL
      rollback:
        - sql:
            dbms: postgresql
            sql: DROP INDEX IF EXISTS uq_master_folio_group
        - sql:
            dbms: postgresql
            sql: ALTER TABLE folios DROP COLUMN IF EXISTS group_id
        - sql:
            dbms: postgresql
            sql: ALTER TABLE reservations DROP COLUMN IF EXISTS room_block_id
        - sql:
            dbms: postgresql
            sql: ALTER TABLE reservations DROP COLUMN IF EXISTS group_id
        - sql:
            dbms: postgresql
            sql: DROP TABLE room_blocks
        - sql:
            dbms: postgresql
            sql: DROP TABLE event_groups
